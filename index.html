<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner de Comprobantes - Renolibra</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 600px; width: 100%; background: #1e1e1e; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; color: #fff; text-align: center; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #aaa; }
    input, select, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 14px; }
    input[type="file"] { padding: 8px; cursor: pointer; }
    button { background: #2563eb; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #4b5563; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .status { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; text-align: center; font-size: 14px; }
    .status.info { background: #1e3a8a; color: #93c5fd; display: block; }
    .status.success { background: #064e3b; color: #6ee7b7; display: block; }
    .status.error { background: #7f1d1d; color: #fca5a5; display: block; }
  </style>
</head>
<body>

<div class="container">
  <h2>Escanear Factura / Comprobante</h2>

  <div class="form-group">
    <label>Seleccionar Imagen o PDF del Comprobante</label>
    <input type="file" id="fileInput" accept="image/*, application/pdf">
  </div>

  <button type="button" id="btnScan">Escanear e Identificar (IA)</button>

  <div id="statusBox" class="status"></div>

  <hr style="border-color: #333; margin: 20px 0;">

  <!-- Formulario de previsualización y confirmación -->
  <form id="facturaForm">
    <div class="grid">
      <div class="form-group">
        <label>Tipo de Operación</label>
        <select id="tipo_operacion" required>
          <option value="compra">Compra (Recibida)</option>
          <option value="venta">Venta (Emitida)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tipo Comprobante</label>
        <input type="text" id="tipo_comprobante" placeholder="Ej: Factura A">
      </div>
    </div>

    <div class="grid">
      <div class="form-group">
        <label>Número Comprobante</label>
        <input type="text" id="numero_comprobante" placeholder="0001-00001234">
      </div>
      <div class="form-group">
        <label>Fecha Emisión</label>
        <input type="date" id="fecha_emision">
      </div>
    </div>

    <div class="grid">
      <div class="form-group">
        <label>Contraparte (Nombre/Razón Social)</label>
        <input type="text" id="emisor_receptor_nombre">
      </div>
      <div class="form-group">
        <label>CUIT / Identificación Contraparte</label>
        <input type="text" id="emisor_receptor_identificacion">
      </div>
    </div>

    <div class="grid">
      <div class="form-group">
        <label>Moneda</label>
        <input type="text" id="moneda" value="ARS">
      </div>
      <div class="form-group">
        <label>Tipo de Cambio</label>
        <input type="number" step="0.01" id="tipo_cambio" value="1">
      </div>
    </div>

    <div class="grid">
      <div class="form-group">
        <label>Neto Gravado</label>
        <input type="number" step="0.01" id="neto_gravado" value="0">
      </div>
      <div class="form-group">
        <label>Monto IVA</label>
        <input type="number" step="0.01" id="iva_monto" value="0">
      </div>
    </div>

    <div class="grid">
      <div class="form-group">
        <label>No Gravado / Exento</label>
        <input type="number" step="0.01" id="no_gravado_exento" value="0">
      </div>
      <div class="form-group">
        <label>Percepciones / Retenciones</label>
        <input type="number" step="0.01" id="percepciones_retenciones" value="0">
      </div>
    </div>

    <div class="form-group">
      <label>Monto Total</label>
      <input type="number" step="0.01" id="monto_total" value="0" required style="font-weight: bold; font-size: 16px;">
    </div>

    <button type="submit" id="btnSave" style="background: #16a34a;">Guardar Comprobante en Base de Datos</button>
  </form>
</div>

<script>
  // CREDENCIALES DE SUPABASE (Reemplazar con los datos de tu proyecto)
  const SUPABASE_URL = 'https://tu-proyecto.supabase.co'; 
  const SUPABASE_ANON_KEY = 'tu-anon-key-de-supabase';

  function getSupabaseClient() {
    if (typeof window.supabase === 'undefined') {
      throw new Error("No se pudo cargar la librería de Supabase.");
    }
    return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  function setStatus(msg, type) {
    const box = document.getElementById('statusBox');
    box.innerText = msg;
    box.className = `status ${type}`;
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });
  }

  // Escuchador asignado directamente por ID
  document.getElementById('btnScan').addEventListener('click', async function() {
    const fileInput = document.getElementById('fileInput');
    const btnScan = document.getElementById('btnScan');

    if (!fileInput.files || fileInput.files.length === 0) {
      alert("Por favor selecciona un archivo PDF o una imagen primero.");
      return;
    }

    const file = fileInput.files[0];
    let mimeType = file.type;
    if (!mimeType && file.name.endsWith('.pdf')) {
      mimeType = 'application/pdf';
    }

    btnScan.disabled = true;
    setStatus("Analizando documento con IA...", "info");

    try {
      const base64 = await fileToBase64(file);

      const response = await fetch('/api/scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mimeType: mimeType, base64: base64 })
      });

      if (data.error) {
        throw new Error(typeof data.error === 'string' ? data.error : JSON.stringify(data.error));
      }
