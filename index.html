<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Contable - Balances</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans p-4">

    <!-- LOGIN Y DIAGNÓSTICO -->
    <div id="login-view" class="max-w-xl mx-auto w-full my-auto space-y-4">
        <div class="bg-slate-800 p-8 rounded-xl border border-slate-700 shadow-xl">
            <h1 class="text-2xl font-bold text-emerald-400 text-center mb-1">ERP Contable</h1>
            <p class="text-xs text-slate-400 text-center mb-6">Conexión Directa API (Sin CDN)</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Correo Electrónico</label>
                    <input type="email" id="email" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" value="renolibra@renolibra.com">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Contraseña</label>
                    <input type="password" id="password" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white" placeholder="••••••••">
                </div>
                <button type="button" id="btn-submit" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2 rounded transition cursor-pointer">
                    Iniciar Sesión
                </button>
            </div>
        </div>

        <!-- CONSOLA DE DIAGNÓSTICO -->
        <div class="bg-black/90 border border-slate-700 rounded-lg p-4 font-mono text-xs text-green-400 h-48 overflow-y-auto space-y-1" id="console-log">
        </div>
    </div>

    <!-- PANEL PRINCIPAL (DASHBOARD) -->
    <div id="dashboard-view" class="hidden flex-1 flex flex-col max-w-5xl mx-auto w-full my-auto">
        <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center rounded-t-xl">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold text-emerald-400">ERP Contable</span>
                <span id="user-role-badge" class="px-2 py-0.5 text-xs rounded font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30">ADMIN</span>
            </div>
            <div class="flex items-center space-x-4">
                <span id="user-email" class="text-sm text-slate-400"></span>
                <button id="logout-btn" class="bg-red-600/80 hover:bg-red-600 text-xs px-3 py-1.5 rounded cursor-pointer">Cerrar Sesión</button>
            </div>
        </header>

        <div class="flex-1 bg-slate-800/40 border border-slate-700 p-6 rounded-b-xl space-y-4">
            <h2 class="text-2xl font-bold mb-2 text-emerald-400">¡Conexión Exitosa con Supabase!</h2>
            <p class="text-slate-300">Has accedido correctamente al sistema de contabilidad.</p>
            <div class="p-4 bg-emerald-950/40 border border-emerald-500/30 rounded text-emerald-300 text-sm">
                <strong>Siguiente paso:</strong> Crear la base de datos para el Plan de Cuentas y los Asientos Contables.
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://dkhvskyuwrinrlfyjahy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRraHZza3l1d3JpbnJsZnlqYWh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMTk5MDIsImV4cCI6MjEwMTc5NTkwMn0.W7hpE2AqADgxZnMd2GygUMVYMIsV5kEzr8YxpQbMMzI';

        const logger = document.getElementById('console-log');
        function log(msg, type = 'info') {
            const div = document.createElement('div');
            const time = new Date().toLocaleTimeString();
            if(type === 'error') div.className = 'text-red-400 font-bold';
            if(type === 'success') div.className = 'text-emerald-300 font-bold';
            div.textContent = `[${time}] ${msg}`;
            logger.appendChild(div);
            logger.scrollTop = logger.scrollHeight;
        }

        log('> Sistema JavaScript inicializado.');
        log('> Listo para conectar con Supabase.');

        const loginView = document.getElementById('login-view');
        const dashboardView = document.getElementById('dashboard-view');
        const btnSubmit = document.getElementById('btn-submit');
        const userEmailSpan = document.getElementById('user-email');
        const logoutBtn = document.getElementById('logout-btn');

        // Verificar si hay token guardado
        const savedToken = localStorage.getItem('sb_access_token');
        const savedEmail = localStorage.getItem('sb_user_email');
        if (savedToken && savedEmail) {
            log('> Sesión guardada encontrada para: ' + savedEmail, 'success');
            showDashboard(savedEmail);
        }

        function showDashboard(email) {
            loginView.classList.add('hidden');
            dashboardView.classList.remove('hidden');
            userEmailSpan.textContent = email;
        }

        async function ejecutarLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!password) {
                log('> Por favor ingrese la contraseña.', 'error');
                return;
            }

            log('> Contactando a Supabase Auth API...');
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Autenticando...';

            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Iniciar Sesión';

                if (!response.ok) {
                    log('> ERROR DE LOGIN: ' + (data.error_description || data.msg || data.message || 'Credenciales inválidas'), 'error');
                } else {
                    log('> ¡LOGIN EXITOSO!', 'success');
                    localStorage.setItem('sb_access_token', data.access_token);
                    localStorage.setItem('sb_user_email', data.user.email);
                    showDashboard(data.user.email);
                }
            } catch (err) {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Iniciar Sesión';
                log('> ERROR DE RED: ' + err.message, 'error');
            }
        }

        btnSubmit.addEventListener('click', ejecutarLogin);

        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') ejecutarLogin();
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.clear();
            location.reload();
        });
    </script>
</body>
</html>
