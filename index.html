<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner de Comprobantes - Renolibra</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 650px; width: 100%; background: #1e1e1e; padding: 24px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; color: #fff; text-align: center; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #aaa; }
    input, select, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 14px; }
    input[type="file"] { padding: 8px; cursor: pointer; }
    button { background: #2563eb; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #4b5563; cursor: not-allowed; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    #debugLog {
      background: #000;
      color: #00ff66;
      font-family: monospace;
      padding: 12px;
      border-radius: 6px;
      height: 140px;
      overflow-y: auto;
      font-size: 12px;
      margin-top: 15px;
      border: 1px solid #333;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Escanear Factura / Comprobante</h2>

  <div class="form-group">
    <label>Seleccionar Imagen o PDF del Comprobante</label>
    <input type="file" id="fileInput" accept="image/*, application/pdf">
  </div>

  <button type="button" id="btnScan" onclick="procesarComprobante()">1. Escanear e Identificar (IA)</button>

  <label style="margin-top: 15px;">Consola de diagnóstico (Estado en tiempo real):</label>
  <div id="debugLog">Consola lista. Selecciona un archivo y presiona Escanear.</div>

  <hr style="border-color: #333; margin: 20px 0;">

  <form id="facturaForm" onsubmit="event.preventDefault();">
    <div class="grid">
      <div class="form-group">
        <label>Tipo de Operación</label>
        <select id="tipo_operacion" required>
          <option value="compra">Compra (Recibida)</option>
          <option value="venta">Venta (Emitida)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tipo Comprobante</label>
        <input type="text" id="tipo_comprobante" placeholder="Ej: Factura A">
      </div>
    </div>

    <div class="grid">
      <div class="form-group">
        <label>Número Comprobante</label>
        <input type="text" id="numero_comprobante" placeholder="0001-00001234">
      </div>
      <div class="form-group">
        <label>Fecha Emisión</label>
        <input type="date" id="fecha_emision">
      </div>
    </div>

    <div class="grid">
      <div class="form-group">
        <label>Contraparte (Nombre/Razón Social)</label>
        <input type="text" id="emisor_receptor_nombre">
      </div>
      <div class="form-group">
        <label>CUIT / Identificación Contraparte</label>
        <input type="text" id="emisor_receptor_identificacion">
      </div>
    </div>

    <div class="grid">
      <div class="form-group">
        <label>Moneda</label>
        <input type="text" id="moneda" value="ARS">
      </div>
      <div class="form-group">
        <label>Tipo de Cambio</label>
        <input type="number" step="0.01" id="tipo_cambio" value="1">
      </div>
    </div>

    <div class="grid">
      <div class="form-group">
        <label>Neto Gravado</label>
        <input type="number" step="0.01" id="neto_gravado" value="0">
      </div>
      <div class="form-group">
        <label>Monto IVA</label>
        <input type="number" step="0.01" id="iva_monto" value="0">
      </div>
    </div>

    <div class="grid">
      <div class="form-group">
        <label>No Gravado / Exento</label>
        <input type="number" step="0.01" id="no_gravado_exento" value="0">
      </div>
      <div class="form-group">
        <label>Percepciones / Retenciones</label>
        <input type="number" step="0.01" id="percepciones_retenciones" value="0">
      </div>
    </div>

    <div class="form-group">
      <label>Monto Total</label>
      <input type="number" step="0.01" id="monto_total" value="0" required style="font-weight: bold; font-size: 16px;">
    </div>

    <button type="button" id="btnSave" style="background: #16a34a;">2. Guardar Comprobante en Base de Datos</button>
  </form>
</div>

<script>
  function log(msg) {
    console.log("[SISTEMA]", msg);
    var logBox = document.getElementById('debugLog');
    if (logBox) {
      var timestamp = new Date().toLocaleTimeString();
      logBox.innerText += "\n[" + timestamp + "] " + msg;
      logBox.scrollTop = logBox.scrollHeight;
    }
  }

  function fileToBase64(file) {
    return new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function() {
        try {
          var result = reader.result;
          if (typeof result === 'string' && result.includes(',')) {
            resolve(result.split(',')[1]);
          } else {
            reject(new Error("No se pudo obtener el formato Base64 del archivo."));
          }
        } catch (e) {
          reject(e);
        }
      };
      reader.onerror = function(err) {
        reject(err || new Error("Error al leer el archivo en el navegador."));
      };
      reader.readAsDataURL(file);
    });
  }

  async function procesarComprobante() {
    log("Iniciando escaneo...");

    var fileInput = document.getElementById('fileInput');
    var btnScan = document.getElementById('btnScan');

    if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
      log("ERROR: No seleccionaste ningún archivo.");
      alert("Por favor selecciona un archivo PDF o imagen primero.");
      return;
    }

    var file = fileInput.files[0];
    var mimeType = file.type;
    if (!mimeType && file.name.toLowerCase().endsWith('.pdf')) {
      mimeType = 'application/pdf';
    }

    log("Archivo detectado: " + file.name + " (" + file.size + " bytes)");
    
    if (btnScan) btnScan.disabled = true;
    log("Convirtiendo a Base64...");

    try {
      var base64 = await fileToBase64(file);
      log("Enviando a /api/scan...");

      var response = await fetch('/api/scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mimeType: mimeType || 'application/pdf', base64: base64 })
      });

      log("Respuesta del servidor. Estado HTTP: " + response.status);

      if (!response.ok) {
        var errText = await response.text();
        throw new Error("HTTP " + response.status + ": " + errText);
      }

      var data = await response.json();

      if (data.error) {
        var errMsg = typeof data.error === 'object' ? JSON.stringify(data.error) : data.error;
        throw new Error(errMsg);
      }

      var textContent = "";
      if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0]) {
        textContent = data.candidates[0].content.parts[0].text;
      } else if (data.text) {
        textContent = data.text;
      } else if (typeof data === 'string') {
        textContent = data;
      } else {
        textContent = JSON.stringify(data);
      }

      var jsonMatch = textContent.match(/\{[\s\S]*\}/);
      if (!jsonMatch) {
        throw new Error("La respuesta no contiene un objeto JSON válido.");
      }

      var parsedData = JSON.parse(jsonMatch[0]);

      document.getElementById('tipo_comprobante').value = parsedData.tipo_comprobante || '';
      document.getElementById('numero_comprobante').value = parsedData.numero_comprobante || '';
      document.getElementById('fecha_emision').value = parsedData.fecha_emision || '';
      document.getElementById('emisor_receptor_nombre').value = parsedData.emisor_receptor_nombre || '';
      document.getElementById('emisor_receptor_identificacion').value = parsedData.emisor_receptor_identificacion || '';
      document.getElementById('moneda').value = parsedData.moneda || 'ARS';
      document.getElementById('tipo_cambio').value = parsedData.tipo_cambio || 1;
      document.getElementById('neto_gravado').value = parsedData.neto_gravado || 0;
      document.getElementById('iva_monto').value = parsedData.iva_monto || 0;
      document.getElementById('no_gravado_exento').value = parsedData.no_gravado_exento || 0;
      document.getElementById('percepciones_retenciones').value = parsedData.percepciones_retenciones || 0;
      document.getElementById('monto_total').value = parsedData.monto_total || 0;

      var opType = String(parsedData.tipo_operacion || '').toLowerCase();
      var nombreContraparte = String(parsedData.emisor_receptor_nombre || '').toLowerCase();
      
      if (opType.includes('venta') || nombreContraparte.includes('cliente')) {
        document.getElementById('tipo_operacion').value = 'venta';
      } else {
        document.getElementById('tipo_operacion').value = 'compra';
      }

      log("PROCESO FINALIZADO: Formulario completado.");

    } catch (err) {
      log("ERROR: " + err.message);
    } finally {
      if (btnScan) btnScan.disabled = false;
    }
  }

  function inicializar() {
    log("Script cargado y listo.");
    var btn = document.getElementById('btnScan');
    if (btn) btn.onclick = procesarComprobante;
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', inicializar);
  } else {
    inicializar();
  }
</script>

</body>
</html>
